components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session-token

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: Optional client-supplied correlation ID echoed by the backend.
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    SinceCursor:
      name: since
      in: query
      required: false
      schema:
        type: integer
        format: int64
        default: 0
        minimum: 0
      description: Last observed realtime event version. Events with greater versions are returned.
    StartInstant:
      name: start
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive analytics window start. Defaults to 30 days before `end`.
    EndInstant:
      name: end
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive analytics window end. Defaults to the current server time.
    AuthorizationEngine:
      name: engine
      in: path
      required: true
      schema:
        type: string
        enum:
          - in-code
          - opa-local
          - casbin-local
          - db-policy
      description: Authorization policy engine to invoke directly for benchmark comparison.
    CacheStrategy:
      name: strategy
      in: path
      required: true
      schema:
        type: string
        enum:
          - redis
          - caffeine
          - memcached
      description: Cache implementation to invoke directly for benchmark comparison.
    CacheKey:
      name: key
      in: path
      required: true
      schema:
        type: string
      description: Cache key. Memcached requires keys to be 250 characters or fewer with no whitespace.
    RateLimitAlgorithm:
      name: algorithm
      in: path
      required: true
      schema:
        type: string
        enum:
          - fixed-window
          - sliding-window
          - token-bucket
      description: Rate limiting algorithm to invoke directly for benchmark comparison.

  headers:
    CorrelationId:
      description: Correlation ID assigned to the request.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request or unsupported domain value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, malformed, expired, or revoked bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated actor is not allowed to perform the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current domain state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    CreateTenantRequest:
      type: object
      required:
        - tenantName
        - workspaceName
        - ownerUserId
        - ownerEmail
        - ownerDisplayName
      properties:
        tenantName:
          type: string
          minLength: 1
        workspaceName:
          type: string
          minLength: 1
        ownerUserId:
          type: string
          minLength: 1
        ownerEmail:
          type: string
          minLength: 1
        ownerDisplayName:
          type: string
          minLength: 1

    CreateWorkspaceRequest:
      type: object
      required:
        - workspaceName
      properties:
        workspaceName:
          type: string
          minLength: 1

    TenantView:
      type: object
      required:
        - tenantId
        - workspaceId
        - tenantName
        - workspaceName
        - status
      properties:
        tenantId:
          type: string
        workspaceId:
          type: string
        tenantName:
          type: string
        workspaceName:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"

    WorkspaceView:
      type: object
      required:
        - workspaceId
        - tenantId
        - workspaceName
        - status
      properties:
        workspaceId:
          type: string
        tenantId:
          type: string
        workspaceName:
          type: string
        status:
          $ref: "#/components/schemas/WorkspaceStatus"

    LoginRequest:
      type: object
      required:
        - userId
        - workspaceId
      properties:
        userId:
          type: string
          minLength: 1
        workspaceId:
          type: string
          minLength: 1

    LoginResponse:
      type: object
      required:
        - token
        - userId
        - tenantId
        - workspaceId
        - expiresAt
      properties:
        token:
          type: string
        userId:
          type: string
        tenantId:
          type: string
        workspaceId:
          type: string
        expiresAt:
          type: string
          format: date-time

    LogoutResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: logged-out

    MeResponse:
      type: object
      required:
        - userId
        - displayName
        - email
        - workspaceId
        - tenantId
        - role
      properties:
        userId:
          type: string
        displayName:
          type: string
        email:
          type: string
        workspaceId:
          type: string
        tenantId:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"

    MembershipResponse:
      type: object
      required:
        - userId
        - workspaceId
        - tenantId
        - role
      properties:
        userId:
          type: string
        workspaceId:
          type: string
        tenantId:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"

    AssignMembershipRequest:
      type: object
      required:
        - userId
        - email
        - displayName
        - role
      properties:
        userId:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        role:
          $ref: "#/components/schemas/MembershipRole"

    MembershipAssignmentView:
      type: object
      required:
        - tenantId
        - workspaceId
        - userId
        - role
        - status
      properties:
        tenantId:
          type: string
        workspaceId:
          type: string
        userId:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"
        status:
          $ref: "#/components/schemas/MembershipStatus"

    CreateChannelRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1

    PostMessageRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1

    ChannelView:
      type: object
      required:
        - channelId
        - workspaceId
        - name
      properties:
        channelId:
          type: string
        workspaceId:
          type: string
        name:
          type: string

    MessageView:
      type: object
      required:
        - messageId
        - channelId
        - authorUserId
        - body
      properties:
        messageId:
          type: string
        channelId:
          type: string
        authorUserId:
          type: string
        body:
          type: string
        parentMessageId:
          type:
            - string
            - "null"

    CreateDocumentRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 12000

    UpdateDocumentRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 12000
        status:
          $ref: "#/components/schemas/DocumentStatus"

    AddCommentRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000

    DocumentView:
      type: object
      required:
        - documentId
        - workspaceId
        - title
        - content
        - status
        - createdByUserId
        - lastModifiedByUserId
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        title:
          type: string
        content:
          type: string
        status:
          $ref: "#/components/schemas/DocumentStatus"
        createdByUserId:
          type: string
        lastModifiedByUserId:
          type: string

    DocumentCommentView:
      type: object
      required:
        - commentId
        - documentId
        - authorUserId
        - body
      properties:
        commentId:
          type: string
        documentId:
          type: string
        authorUserId:
          type: string
        body:
          type: string

    CreateTaskRequest:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 4000
        assigneeUserId:
          type:
            - string
            - "null"

    UpdateTaskRequest:
      type: object
      required:
        - title
        - description
        - status
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 4000
        status:
          $ref: "#/components/schemas/TaskStatus"
        assigneeUserId:
          type:
            - string
            - "null"

    AddTaskCommentRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000

    TaskView:
      type: object
      required:
        - taskId
        - workspaceId
        - title
        - description
        - status
        - createdByUserId
      properties:
        taskId:
          type: string
        workspaceId:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        assigneeUserId:
          type:
            - string
            - "null"
        createdByUserId:
          type: string

    TaskCommentView:
      type: object
      required:
        - commentId
        - taskId
        - authorUserId
        - body
      properties:
        commentId:
          type: string
        taskId:
          type: string
        authorUserId:
          type: string
        body:
          type: string

    RealtimePollResponse:
      type: object
      required:
        - nextCursor
        - events
      properties:
        nextCursor:
          type: integer
          format: int64
        events:
          type: array
          items:
            $ref: "#/components/schemas/RealtimeEvent"

    RealtimeEvent:
      type: object
      required:
        - version
        - schemaVersion
        - eventId
        - eventType
        - tenantId
        - aggregateId
        - occurredAt
        - recordedAt
        - payload
      properties:
        version:
          type: integer
          format: int64
        schemaVersion:
          type: string
          example: realtime.event.v1
        eventId:
          type: string
        eventType:
          type: string
          example: DocumentCreatedEvent
        tenantId:
          type: string
        workspaceId:
          type:
            - string
            - "null"
        aggregateId:
          type: string
        occurredAt:
          type: string
          format: date-time
        recordedAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true

    AnalyticsEventView:
      type: object
      required:
        - eventId
        - tenantId
        - eventType
        - eventCategory
        - eventData
        - createdAt
      properties:
        eventId:
          type: string
        tenantId:
          type: string
        userId:
          type:
            - string
            - "null"
        workspaceId:
          type:
            - string
            - "null"
        eventType:
          type: string
          example: search
        eventCategory:
          type: string
          example: engagement
        resourceType:
          type:
            - string
            - "null"
        resourceId:
          type:
            - string
            - "null"
        eventData:
          type: object
          additionalProperties: true
          example:
            query: architecture
            resultCount: 3
        createdAt:
          type: string
          format: date-time

    AuthorizationDecisionRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          example: document:update
        resourceType:
          type:
            - string
            - "null"
          example: document
        resourceId:
          type:
            - string
            - "null"
        resourceTenantId:
          type:
            - string
            - "null"
        resourceOwnerUserId:
          type:
            - string
            - "null"
        assigneeUserId:
          type:
            - string
            - "null"
        attributes:
          type:
            - object
            - "null"
          additionalProperties: true
          example:
            status: DRAFT
            riskLevel: LOW

    AuthorizationDecision:
      type: object
      required:
        - strategyVersion
        - strategy
        - policyId
        - allowed
        - reason
        - actorUserId
        - tenantId
        - workspaceId
        - role
        - action
        - matchedRules
        - evaluatedAt
      properties:
        strategyVersion:
          type: string
          example: v2
        strategy:
          type: string
          enum:
            - rbac
            - abac-opa
            - in-code
            - opa-local
            - casbin-local
            - db-policy
        policyId:
          type: string
        allowed:
          type: boolean
        reason:
          type: string
        actorUserId:
          type: string
        tenantId:
          type: string
        workspaceId:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"
        action:
          type: string
        resourceType:
          type:
            - string
            - "null"
        resourceId:
          type:
            - string
            - "null"
        matchedRules:
          type: array
          items:
            type: string
        evaluatedAt:
          type: string
          format: date-time

    AuthorizationEngineResponse:
      type: object
      required:
        - selectedEngine
      properties:
        selectedEngine:
          type: string
          enum:
            - in-code
            - opa-local
            - casbin-local
            - db-policy

    CacheStrategyResponse:
      type: object
      required:
        - selectedStrategy
      properties:
        selectedStrategy:
          type: string
          enum:
            - redis
            - caffeine
            - memcached

    CacheSetRequest:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          minLength: 1
        value:
          description: JSON value to cache.
        ttlSeconds:
          type:
            - integer
            - "null"
          format: int64
          minimum: 1

    CacheIncrementRequest:
      type: object
      properties:
        ttlSeconds:
          type:
            - integer
            - "null"
          format: int64
          minimum: 1
          default: 60

    CacheEntryResponse:
      type: object
      required:
        - strategy
        - key
        - hit
        - ttlSeconds
        - observedAt
      properties:
        strategy:
          type: string
          enum:
            - redis
            - caffeine
            - memcached
        key:
          type: string
        hit:
          type: boolean
        value:
          description: Cached JSON value when `hit` is true.
        ttlSeconds:
          type: integer
          format: int64
          description: Remaining TTL in seconds, or -1 when the backend does not expose TTL.
        observedAt:
          type: string
          format: date-time

    CacheCounterResponse:
      type: object
      required:
        - strategy
        - key
        - value
        - ttlSeconds
        - observedAt
      properties:
        strategy:
          type: string
          enum:
            - redis
            - caffeine
            - memcached
        key:
          type: string
        value:
          type: integer
          format: int64
        ttlSeconds:
          type: integer
          format: int64
          description: Remaining TTL in seconds, or -1 when the backend does not expose TTL.
        observedAt:
          type: string
          format: date-time

    RateLimitAlgorithmResponse:
      type: object
      required:
        - selectedAlgorithm
      properties:
        selectedAlgorithm:
          type: string
          enum:
            - fixed-window
            - sliding-window
            - token-bucket

    RateLimitDecisionRequest:
      type: object
      required:
        - key
        - limit
        - windowSeconds
      properties:
        key:
          type: string
          minLength: 1
        limit:
          type: integer
          format: int32
          minimum: 1
          example: 100
        windowSeconds:
          type: integer
          format: int32
          minimum: 1
          example: 60

    RateLimitDecision:
      type: object
      required:
        - algorithm
        - key
        - allowed
        - limit
        - remaining
        - retryAfterSeconds
        - resetSeconds
        - observedAt
      properties:
        algorithm:
          type: string
          enum:
            - fixed-window
            - sliding-window
            - token-bucket
        key:
          type: string
        allowed:
          type: boolean
        limit:
          type: integer
          format: int32
        remaining:
          type: integer
          format: int64
        retryAfterSeconds:
          type: integer
          format: int64
          description: Seconds until the caller should retry when rejected, or 0 when allowed.
        resetSeconds:
          type: integer
          format: int64
          description: Algorithm-specific reset estimate in seconds.
        observedAt:
          type: string
          format: date-time

    PlatformInfoResponse:
      type: object
      required:
        - service
        - version
        - architectureStyle
        - modules
      properties:
        service:
          type: string
          example: platform-backend
        version:
          type: string
          example: 0.0.1-SNAPSHOT
        architectureStyle:
          type: string
          example: modular-monolith
        modules:
          type: array
          items:
            type: string
        requestContext:
          anyOf:
            - $ref: "#/components/schemas/RequestContextResponse"
            - type: "null"

    RequestContextResponse:
      type: object
      required:
        - correlationId
      properties:
        tenantId:
          type:
            - string
            - "null"
        workspaceId:
          type:
            - string
            - "null"
        userId:
          type:
            - string
            - "null"
        correlationId:
          type: string

    GraphqlRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: GraphQL document.
          example: "query($workspaceId: ID!) { tasks(workspaceId: $workspaceId) { taskId title status } }"
        operationName:
          type:
            - string
            - "null"
        variables:
          type: object
          additionalProperties: true

    GraphqlResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
        errors:
          type: array
          items:
            type: object
            additionalProperties: true

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - CONFLICT
            - UNAUTHORIZED
            - FORBIDDEN
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    TenantStatus:
      type: string
      enum:
        - ACTIVE

    WorkspaceStatus:
      type: string
      enum:
        - ACTIVE

    MembershipRole:
      type: string
      enum:
        - OWNER
        - ADMIN
        - MEMBER

    MembershipStatus:
      type: string
      enum:
        - ACTIVE

    TaskStatus:
      type: string
      enum:
        - TODO
        - IN_PROGRESS
        - BLOCKED
        - DONE
        - CANCELED

    DocumentStatus:
      type: string
      enum:
        - DRAFT
        - IN_REVIEW
        - ACTIVE
        - ARCHIVED
