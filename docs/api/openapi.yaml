openapi: 3.1.0
info:
  title: Collaboration Platform API
  version: 0.0.1-SNAPSHOT
  description: REST API contract for the modular collaboration platform backend.
servers:
  - url: http://localhost:8080
    description: Local backend
tags:
  - name: Tenant Management
  - name: Identity Access
  - name: Messaging
  - name: Documents
  - name: Tasks
  - name: Analytics
  - name: Realtime
  - name: Cache
  - name: Rate Limiting
  - name: Platform
  - name: GraphQL
security:
  - bearerAuth: []
paths:
  /api/tenants:
    post:
      tags:
        - Tenant Management
      summary: Bootstrap a tenant, default workspace, owner user, and owner membership.
      operationId: createTenant
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "200":
          description: Tenant bootstrap result.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/tenants/{tenantId}/workspaces:
    post:
      tags:
        - Tenant Management
      summary: Create a workspace in an existing tenant.
      operationId: createWorkspace
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "200":
          description: Created workspace.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/workspaces/{workspaceId}:
    get:
      tags:
        - Tenant Management
      summary: Get workspace details.
      operationId: getWorkspace
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace details.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/workspaces/{workspaceId}/settings:
    patch:
      tags:
        - Tenant Management
      summary: Update workspace settings.
      description: Current implementation returns the workspace view without accepting a request body.
      operationId: updateWorkspaceSettings
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Updated workspace.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tenants/{tenantId}/analytics/events:
    get:
      tags:
        - Analytics
      summary: List tenant analytics events from PostgreSQL JSONB.
      description: Baseline analytics storage comparison endpoint backed by the `analytics_events.event_data` JSON column in PostgreSQL.
      operationId: listPostgresJsonbAnalyticsEventsV1
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StartInstant"
        - $ref: "#/components/parameters/EndInstant"
      responses:
        "200":
          description: Analytics events stored in PostgreSQL JSONB.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyticsEventView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/tenants/{tenantId}/analytics/events:
    get:
      tags:
        - Analytics
      summary: List tenant analytics events from MongoDB.
      description: Document-store analytics comparison endpoint backed by the MongoDB `analytics_events` collection.
      operationId: listMongoAnalyticsEventsV2
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StartInstant"
        - $ref: "#/components/parameters/EndInstant"
      responses:
        "200":
          description: Analytics events stored in MongoDB.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyticsEventView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/workspaces/{workspaceId}/authorization/decisions:
    post:
      tags:
        - Identity Access
      summary: Evaluate an authorization decision using RBAC.
      description: Authorization comparison baseline using workspace roles only: OWNER, ADMIN, and MEMBER.
      operationId: decideAuthorizationRbacV1
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationDecisionRequest"
      responses:
        "200":
          description: RBAC authorization decision.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/workspaces/{workspaceId}/authorization/decisions:
    post:
      tags:
        - Identity Access
      summary: Evaluate an authorization decision using ABAC/OPA-style policy rules.
      description: Attribute-aware authorization comparison endpoint. This local evaluator follows an OPA-style input/decision shape without requiring an external OPA runtime.
      operationId: decideAuthorizationAbacOpaV2
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationDecisionRequest"
      responses:
        "200":
          description: ABAC/OPA-style authorization decision.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/workspaces/{workspaceId}/authorization/decisions:
    post:
      tags:
        - Identity Access
      summary: Evaluate an authorization decision using the selected policy engine.
      description: Stable authorization endpoint backed by `platform.feature.authorization.engine`.
      operationId: decideAuthorizationSelectedEngine
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationDecisionRequest"
      responses:
        "200":
          description: Selected policy engine authorization decision.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/benchmarks/authorization/engine:
    get:
      tags:
        - Identity Access
      summary: Get the selected authorization policy engine.
      description: Reports the `platform.feature.authorization.engine` value used by application authorization guards.
      operationId: getSelectedAuthorizationPolicyEngine
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Selected authorization policy engine.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationEngineResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/benchmarks/authorization/{engine}/decisions:
    post:
      tags:
        - Identity Access
      summary: Evaluate an authorization decision using a specific policy engine.
      description: Benchmark endpoint for in-code, local OPA-compatible, and local Casbin-style policy engine comparison.
      operationId: decideAuthorizationBenchmarkEngine
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AuthorizationEngine"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationDecisionRequest"
      responses:
        "200":
          description: Direct policy engine authorization decision.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/workspaces/{workspaceId}/events:
    get:
      tags:
        - Realtime
      summary: Poll versioned realtime events for a workspace.
      description: Polling baseline for realtime comparison. Use `nextCursor` as the next `since` value.
      operationId: pollRealtimeEventsV1
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SinceCursor"
      responses:
        "200":
          description: Versioned workspace events after the supplied cursor.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimePollResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/workspaces/{workspaceId}/events/stream:
    get:
      tags:
        - Realtime
      summary: Stream versioned realtime events for a workspace using Server-Sent Events.
      description: SSE comparison endpoint. Each event uses the event version as the SSE `id`.
      operationId: streamRealtimeEventsV2
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SinceCursor"
      responses:
        "200":
          description: Server-Sent Event stream of versioned realtime events.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RealtimeEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ws/v3/realtime:
    get:
      tags:
        - Realtime
      summary: WebSocket realtime endpoint for bidirectional subscriptions.
      description: Send `{"action":"subscribe","workspaceId":"workspace-id"}` to receive versioned realtime event envelopes.
      operationId: realtimeWebSocketV3
      responses:
        "101":
          description: WebSocket protocol upgrade.

  /api/benchmarks/cache/strategy:
    get:
      tags:
        - Cache
      summary: Get the cache strategy selected for stable runtime usage.
      description: Reports the `platform.feature.cache.mode` value used by the shared application cache facade.
      operationId: getSelectedCacheStrategy
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Selected cache strategy.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheStrategyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/benchmarks/cache/{strategy}/entries:
    post:
      tags:
        - Cache
      summary: Write a cache entry using a specific cache strategy.
      description: Benchmark endpoint for direct Redis, Caffeine, or Memcached comparison without changing the stable cache facade.
      operationId: setCacheEntryForStrategy
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CacheStrategy"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CacheSetRequest"
      responses:
        "200":
          description: Stored cache entry observation.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheEntryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/benchmarks/cache/{strategy}/entries/{key}:
    get:
      tags:
        - Cache
      summary: Read a cache entry using a specific cache strategy.
      operationId: getCacheEntryForStrategy
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CacheStrategy"
        - $ref: "#/components/parameters/CacheKey"
      responses:
        "200":
          description: Cache entry observation.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheEntryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags:
        - Cache
      summary: Delete a cache entry using a specific cache strategy.
      operationId: deleteCacheEntryForStrategy
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CacheStrategy"
        - $ref: "#/components/parameters/CacheKey"
      responses:
        "200":
          description: Cache entry deletion observation.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheEntryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/benchmarks/cache/{strategy}/counters/{key}/increment:
    post:
      tags:
        - Cache
      summary: Increment a cache counter using a specific cache strategy.
      operationId: incrementCacheCounterForStrategy
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CacheStrategy"
        - $ref: "#/components/parameters/CacheKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CacheIncrementRequest"
      responses:
        "200":
          description: Cache counter observation.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheCounterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/benchmarks/rate-limit/algorithm:
    get:
      tags:
        - Rate Limiting
      summary: Get the rate limiting algorithm selected for stable runtime usage.
      description: Reports the `platform.feature.rate-limit.mode` value used by the shared rate limit service.
      operationId: getSelectedRateLimitAlgorithm
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Selected rate limiting algorithm.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitAlgorithmResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/benchmarks/rate-limit/{algorithm}/decisions:
    post:
      tags:
        - Rate Limiting
      summary: Evaluate a rate limit decision using a specific algorithm.
      description: Benchmark endpoint for fixed-window, sliding-window, and token-bucket comparison behind the same request shape.
      operationId: evaluateRateLimitDecisionForAlgorithm
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/RateLimitAlgorithm"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateLimitDecisionRequest"
      responses:
        "200":
          description: Rate limit decision.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/login:
    post:
      tags:
        - Identity Access
      summary: Create a user session for a workspace.
      operationId: login
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login result with bearer token.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/auth/logout:
    post:
      tags:
        - Identity Access
      summary: Revoke the current user session.
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Logout status.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/me:
    get:
      tags:
        - Identity Access
      summary: Get the current authenticated actor.
      operationId: getCurrentUser
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current actor.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/workspaces/{workspaceId}/memberships/me:
    get:
      tags:
        - Identity Access
      summary: Get the current actor's membership in a workspace.
      operationId: getCurrentMembership
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Current workspace membership.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/workspaces/{workspaceId}/memberships:
    post:
      tags:
        - Identity Access
      summary: Assign a user membership to a workspace.
      operationId: assignMembership
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignMembershipRequest"
      responses:
        "200":
          description: Assigned membership.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipAssignmentView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/workspaces/{workspaceId}/channels:
    get:
      tags:
        - Messaging
      summary: List workspace channels.
      operationId: listChannels
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Channels in name order.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelView"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Messaging
      summary: Create a workspace channel.
      operationId: createChannel
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "200":
          description: Created channel.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/channels/{channelId}/messages:
    get:
      tags:
        - Messaging
      summary: List messages in a channel.
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Messages in creation order.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageView"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Messaging
      summary: Post a message to a channel.
      operationId: postMessage
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
      responses:
        "200":
          description: Posted message.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/messages/{messageId}/replies:
    post:
      tags:
        - Messaging
      summary: Reply to a message.
      operationId: replyToMessage
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
      responses:
        "200":
          description: Reply message.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/workspaces/{workspaceId}/documents:
    get:
      tags:
        - Documents
      summary: List workspace documents.
      operationId: listDocuments
      parameters:
