groups:
  - name: platform-availability
    rules:
      - alert: PlatformBackendDown
        expr: up{job="platform-backend"} == 0
        for: 2m
        labels:
          severity: page
          service: platform-backend
        annotations:
          summary: "Platform backend is not scrapeable"
          description: "Prometheus has not been able to scrape platform-backend for 2 minutes."

      - alert: ObservabilityTargetDown
        expr: up{job!="platform-backend"} == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Observability target is down"
          description: "{{ $labels.job }} target {{ $labels.instance }} has been down for 5 minutes."

      - alert: AlloyCollectorMissing
        expr: absent(up{job="alloy"} == 1)
        for: 3m
        labels:
          severity: page
          service: alloy
        annotations:
          summary: "Grafana Alloy collector is missing"
          description: "Prometheus cannot scrape Alloy. Metrics, logs, and traces may stop flowing."

      - alert: AlloyRemoteWriteFailures
        expr: increase(prometheus_remote_storage_samples_failed_total{job="alloy"}[5m]) > 0
        for: 1m
        labels:
          severity: ticket
          service: alloy
        annotations:
          summary: "Alloy remote write failures detected"
          description: "Alloy failed to remote-write samples to Prometheus in the last 5 minutes."

  - name: platform-slo
    rules:
      - alert: HighHttp5xxErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{job="platform-backend",status=~"5..",uri!~"/actuator.*"}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{job="platform-backend",uri!~"/actuator.*"}[5m])), 0.001)
          ) > 0.02
        for: 5m
        labels:
          severity: page
          service: platform-backend
        annotations:
          summary: "High backend 5xx rate"
          description: "5xx responses are above 2% for 5 minutes. Current value: {{ printf \"%.2f\" $value }}."

      - alert: HighHttpLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_server_requests_seconds_bucket{job="platform-backend",uri!~"/actuator.*"}[5m])) by (le)
          ) > 0.5
        for: 10m
        labels:
          severity: ticket
          service: platform-backend
        annotations:
          summary: "High backend p95 latency"
          description: "p95 HTTP latency has been above 500ms for 10 minutes."

      - alert: TraceDerivedHighHttp5xxErrorRate
        expr: |
          (
            sum(rate(traces_spanmetrics_calls_total{http_status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(traces_spanmetrics_calls_total[5m])), 0.001)
          ) > 0.02
        for: 5m
        labels:
          severity: ticket
          service: platform-backend
        annotations:
          summary: "Trace-derived 5xx rate is high"
          description: "Span metrics show 5xx responses above 2% for 5 minutes."

      - alert: TraceIngestionStopped
        expr: |
          sum(rate(http_server_requests_seconds_count{job="platform-backend",uri!~"/actuator.*"}[10m])) > 0
          and
          sum(rate(otelcol_receiver_accepted_spans{job="alloy"}[10m])) == 0
        for: 15m
        labels:
          severity: ticket
          service: platform-backend
        annotations:
          summary: "No spans received by Alloy"
          description: "Alloy has not accepted spans for 15 minutes while the observability stack is running."

  - name: platform-runtime
    rules:
      - alert: JvmHeapPressureHigh
        expr: |
          (
            sum(jvm_memory_used_bytes{job="platform-backend",area="heap"})
            /
            sum(jvm_memory_max_bytes{job="platform-backend",area="heap"})
          ) > 0.85
        for: 10m
        labels:
          severity: ticket
          service: platform-backend
        annotations:
          summary: "JVM heap pressure is high"
          description: "Heap usage has been above 85% for 10 minutes."

      - alert: EventPublishingFailures
        expr: increase(events_failed_total{job="platform-backend"}[10m]) > 0
        for: 1m
        labels:
          severity: ticket
          service: platform-backend
        annotations:
          summary: "Event publishing failures detected"
          description: "Domain event publishing failures increased in the last 10 minutes."

      - alert: OutboxBacklogGrowing
        expr: outbox_unpublished_events{job="platform-backend"} > 100
        for: 15m
        labels:
          severity: ticket
          service: platform-backend
        annotations:
          summary: "Outbox backlog is high"
          description: "Unpublished outbox events have remained above 100 for 15 minutes."

  - name: postgres
    rules:
      - alert: PostgresExporterDown
        expr: up{job=~"postgres-(primary|replica)"} == 0
        for: 2m
        labels:
          severity: ticket
          service: postgres
        annotations:
          summary: "PostgreSQL exporter is down"
          description: "{{ $labels.job }} has not been scrapeable for 2 minutes."

      - alert: PostgresConnectionsHigh
        expr: |
          (
            100 * pg_stat_database_numbackends{datname="platform"}
            / ignoring(datname) group_left
            pg_settings_max_connections
          ) > 80
        for: 5m
        labels:
          severity: ticket
          service: postgres
        annotations:
          summary: "PostgreSQL connection usage is high"
          description: "{{ $labels.job }} is using more than 80% of max_connections for 5 minutes."

      - alert: PostgresDeadlocksDetected
        expr: increase(pg_stat_database_deadlocks{datname="platform"}[5m]) > 0
        for: 1m
        labels:
          severity: ticket
          service: postgres
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "{{ $labels.job }} reported deadlocks in the last 5 minutes."
