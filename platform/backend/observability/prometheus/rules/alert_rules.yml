groups:
  - name: platform-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          (
            increase(api_errors_total[5m])
            /
            increase(http_server_requests_seconds_count[5m])
          ) > 0.05
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "High API error rate detected"
          description: "API error rate > 5% over 5m ({{ $value }})"

      - alert: SlowDatabaseQueries
        expr: histogram_quantile(0.95, sum(rate(database_query_time_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Slow database queries (95th percentile > 1s)"
          description: "Database queries are slow; 95th percentile > 1s"

