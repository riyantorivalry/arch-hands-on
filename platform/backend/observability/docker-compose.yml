version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: observability_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 9090:9090
    restart: unless-stopped

  grafana:
    image: grafana/grafana:9.5.0
    container_name: observability_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 3000:3000
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:2.8.2
    container_name: observability_loki
    ports:
      - 3100:3100
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.8.2
    container_name: observability_promtail
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - ../logs:/var/log/platform:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.41
    container_name: observability_jaeger
    ports:
      - 16686:16686   # Jaeger UI
      - 14268:14268   # Zipkin/OTLP collector endpoint
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
