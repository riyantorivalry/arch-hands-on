version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: observability_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 9090:9090
    restart: unless-stopped

  grafana:
    image: grafana/grafana:9.5.0
    container_name: observability_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 3000:3000
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:2.8.2
    container_name: observability_loki
    ports:
      - 3100:3100
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.8.2
    container_name: observability_promtail
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - ../logs:/var/log/platform:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.41
    container_name: observability_jaeger
    ports:
      - 16686:16686   # Jaeger UI
      - 14268:14268   # Zipkin/OTLP collector endpoint
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.25.1
    container_name: observability_alertmanager
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - 9093:9093
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.79.0
    container_name: observability_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - 4317:4317   # OTLP gRPC (host -> collector)
      - 4318:4318   # OTLP HTTP (host -> collector)
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:1.5.0
    container_name: observability_tempo
    ports:
      - 3200:3200   # Tempo query/http
      - 9411:9411   # Zipkin receiver
    volumes:
      - tempo-data:/var/tempo
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.8.0
    container_name: observability_opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Admin@123456
    ports:
      - 9200:9200   # OpenSearch API
      - 9600:9600   # Performance Analyzer
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.8.0
    container_name: observability_opensearch_dashboards
    ports:
      - 5601:5601   # Dashboard UI
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=Admin@123456
    depends_on:
      - opensearch
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:
  tempo-data:
  opensearch-data:




