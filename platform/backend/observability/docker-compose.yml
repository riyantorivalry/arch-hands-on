x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.11.3}
    container_name: observability_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost:9090}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - alertmanager
    restart: unless-stopped
    logging: *default-logging

  postgres-exporter-primary:
    image: ${POSTGRES_EXPORTER_IMAGE:-quay.io/prometheuscommunity/postgres-exporter:v0.19.1}
    container_name: observability_postgres_exporter_primary
    environment:
      DATA_SOURCE_URI: ${POSTGRES_PRIMARY_EXPORTER_URI:-host.docker.internal:5432/platform?sslmode=disable}
      DATA_SOURCE_USER: ${POSTGRES_PRIMARY_EXPORTER_USER:-platform}
      DATA_SOURCE_PASS: ${POSTGRES_PRIMARY_EXPORTER_PASSWORD:-platform}
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"
    ports:
      - "${POSTGRES_PRIMARY_EXPORTER_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PRIMARY_EXPORTER_PORT:-9187}:9187"
    restart: unless-stopped
    logging: *default-logging

  postgres-exporter-replica:
    image: ${POSTGRES_EXPORTER_IMAGE:-quay.io/prometheuscommunity/postgres-exporter:v0.19.1}
    container_name: observability_postgres_exporter_replica
    environment:
      DATA_SOURCE_URI: ${POSTGRES_REPLICA_EXPORTER_URI:-host.docker.internal:5433/platform?sslmode=disable}
      DATA_SOURCE_USER: ${POSTGRES_REPLICA_EXPORTER_USER:-platform}
      DATA_SOURCE_PASS: ${POSTGRES_REPLICA_EXPORTER_PASSWORD:-platform}
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"
    ports:
      - "${POSTGRES_REPLICA_EXPORTER_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_REPLICA_EXPORTER_PORT:-9188}:9187"
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.0.1-security-01}
    container_name: observability_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in platform/backend/observability/.env}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_EXPLORE_ENABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_LOG_MODE: console
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
      - pyroscope
    restart: unless-stopped
    logging: *default-logging

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.2}
    container_name: observability_loki
    ports:
      - "${LOKI_BIND_ADDRESS:-127.0.0.1}:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yaml
    restart: unless-stopped
    logging: *default-logging

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.16.1}
    container_name: observability_alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT:-local}
      PLATFORM_BACKEND_METRICS_TARGET: ${PLATFORM_BACKEND_METRICS_TARGET:-host.docker.internal:8080}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../logs:/var/log/platform:ro
      - alloy-data:/var/lib/alloy
    ports:
      - "${ALLOY_BIND_ADDRESS:-127.0.0.1}:${ALLOY_PORT:-12345}:12345"
      - "${OTLP_GRPC_BIND_ADDRESS:-127.0.0.1}:${OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC (host -> Alloy)
      - "${OTLP_HTTP_BIND_ADDRESS:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP (host -> Alloy)
    depends_on:
      - prometheus
      - loki
      - tempo
      - postgres-exporter-primary
      - postgres-exporter-replica
    restart: unless-stopped
    logging: *default-logging

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.32.1}
    container_name: observability_alertmanager
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_BIND_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped
    logging: *default-logging

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.10.5}
    container_name: observability_tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "${TEMPO_BIND_ADDRESS:-127.0.0.1}:${TEMPO_PORT:-3200}:3200"   # Tempo query/http
      - "${ZIPKIN_BIND_ADDRESS:-127.0.0.1}:${ZIPKIN_PORT:-9411}:9411"   # Zipkin receiver
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    logging: *default-logging

  pyroscope:
    image: ${PYROSCOPE_IMAGE:-grafana/pyroscope:2.0.1}
    container_name: observability_pyroscope
    command:
      - server
    ports:
      - "${PYROSCOPE_BIND_ADDRESS:-127.0.0.1}:${PYROSCOPE_PORT:-4040}:4040"
    volumes:
      - pyroscope-data:/var/lib/pyroscope
    restart: unless-stopped
    logging: *default-logging

  opensearch:
    image: opensearchproject/opensearch:2.8.0
    container_name: observability_opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${OPENSEARCH_BIND_ADDRESS:-127.0.0.1}:${OPENSEARCH_PORT:-9200}:9200"   # OpenSearch API
      - "${OPENSEARCH_PERF_BIND_ADDRESS:-127.0.0.1}:${OPENSEARCH_PERF_PORT:-9600}:9600"   # Performance Analyzer
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped
    logging: *default-logging

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.8.0
    container_name: observability_opensearch_dashboards
    ports:
      - "${OPENSEARCH_DASHBOARDS_BIND_ADDRESS:-127.0.0.1}:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"   # Dashboard UI
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
    depends_on:
      - opensearch
    restart: unless-stopped
    logging: *default-logging

  toxiproxy:
    image: shopify/toxiproxy:2.1.4
    container_name: observability_toxiproxy
    ports:
      - "${TOXIPROXY_BIND_ADDRESS:-127.0.0.1}:${TOXIPROXY_PORT:-8474}:8474"   # Toxiproxy REST API
      - "${OPENSEARCH_PROXY_BIND_ADDRESS:-127.0.0.1}:${OPENSEARCH_PROXY_PORT:-9201}:9201"   # OpenSearch proxy for host-based backend traffic
    restart: unless-stopped
    logging: *default-logging

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  alertmanager-data:
  tempo-data:
  pyroscope-data:
  opensearch-data:




