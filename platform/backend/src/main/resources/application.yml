spring:
  application:
    name: platform-backend
  datasource:
    # Backward-compatible default datasource (used when master block is not provided).
    url: jdbc:postgresql://localhost:5432/platform
    username: platform
    password: platform
    master:
      url: jdbc:postgresql://localhost:5432/platform
      username: platform
      password: platform
    # Optional read replica. If omitted, read traffic falls back to master.
    replica:
      url: jdbc:postgresql://localhost:5433/platform
      username: platform_readonly
      password: platform_readonly
      hikari:
        read-only: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
    mongodb:
      host: localhost
      port: 27017
      database: platform_analytics
    elasticsearch:
      uris: ${SPRING_DATA_ELASTICSEARCH_URIS:http://localhost:9200}
      username: ${SPRING_DATA_ELASTICSEARCH_USERNAME:}
      password: ${SPRING_DATA_ELASTICSEARCH_PASSWORD:}

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: platform-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  docker:
    compose:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
      base-path: /actuator
      path-mapping:
        prometheus: prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
      show-components: ${MANAGEMENT_HEALTH_SHOW_COMPONENTS:never}
      livenessState:
        enabled: true
      readinessState:
        enabled: true
    metrics:
      enabled: true
    env:
      enabled: true
    loggers:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 15s
        descriptions: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        task.processing.time: true
        document.processing.time: true
        collaboration.latency: true
        event.publishing.time: true
        database.query.time: true
        api.response.time: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s
    tags:
      application: ${spring.application.name}
      environment: ${PLATFORM_ENVIRONMENT:local}
      instance_id: ${HOSTNAME:localhost}
    web:
      server:
        request:
          autotime:
            enabled: true
    enable:
      jvm: true
      process: true
      system: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.10}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

server:
  shutdown: graceful

platform:
  event-publishing:
    mode: outbox
    kafka:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [corr=%X{correlationId:-} req=%X{requestId:-} trace=%X{traceId:-} tenant=%X{tenantId:-} user=%X{userId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.example.platform: ${LOGGING_LEVEL_COM_EXAMPLE_PLATFORM:INFO}
    com.example.platform.common.infrastructure.observability: ${LOGGING_LEVEL_OBSERVABILITY:INFO}
    org.springframework: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:WARN}
  file:
    name: logs/platform-backend.log
    max-size: 100MB
    max-history: 30
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 1GB
