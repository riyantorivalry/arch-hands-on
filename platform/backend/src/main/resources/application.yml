spring:
  application:
    name: platform-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/platform
    username: platform
    password: platform
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [corr=%X{correlationId:-} tenant=%X{tenantId:-} workspace=%X{workspaceId:-} user=%X{userId:-}] %logger{36} - %msg%n"
