spring:
  application:
    name: platform-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/platform
    username: platform
    password: platform
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

   #Phase 2: Redis configuration (disabled for local dev without Docker)
  data:
     redis:
       host: localhost
       port: 6379
       timeout: 2000ms
       lettuce:
         pool:
           max-active: 8
           max-idle: 8
           min-idle: 0
     mongodb:
       host: localhost
       port: 27017
       database: platform_analytics
      elasticsearch:
        uris: http://localhost:9200

   #Phase 2: Kafka configuration (disabled for local dev without Docker)
  kafka:
     bootstrap-servers: localhost:9092
     producer:
       key-serializer: org.apache.kafka.common.serialization.StringSerializer
       value-serializer: org.apache.kafka.common.serialization.StringSerializer
       acks: all
       retries: 3
     consumer:
       group-id: platform-backend
       auto-offset-reset: earliest
       key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
       value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # Disable Docker Compose for local development
  docker:
    compose:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,threaddump,heapdump
      base-path: /actuator
      path-mapping:
        prometheus: prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
      livenessState:
        enabled: true
      readinessState:
        enabled: true
    metrics:
      enabled: true
    env:
      enabled: true
    loggers:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        task.processing.time: true
        document.processing.time: true
        collaboration.latency: true
        event.publishing.time: true
        database.query.time: true
        api.response.time: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s
    tags:
      application: ${spring.application.name}
      instance_id: ${HOSTNAME:localhost}
  tracing:
    sampling:
      probability: 1.0

server:
  shutdown: graceful

# Phase 2: Platform-specific configuration
platform:
  event-publishing:
    mode: outbox  # Options: in-process, kafka, outbox
    kafka:
      enabled: false  # Set to true to enable Kafka publishing

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [corr=%X{correlationId:-} req=%X{requestId:-} trace=%X{traceId:-} tenant=%X{tenantId:-} user=%X{userId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.example.platform: DEBUG
    com.example.platform.common.infrastructure.observability: DEBUG
    org.springframework: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  file:
    name: logs/platform-backend.log
    max-size: 100MB
    max-history: 30
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 1GB
