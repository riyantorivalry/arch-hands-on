spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:file:./data/platform-local;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    master:
      url: jdbc:h2:file:./data/platform-local;MODE=PostgreSQL;AUTO_SERVER=TRUE
      driver-class-name: org.h2.Driver
      username: sa
      password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

platform:
  auth:
    jwt:
      secret: ${PLATFORM_AUTH_JWT_SECRET:local-development-jwt-secret-minimum-32-bytes-do-not-use}
  event-publishing:
    kafka:
      enabled: false  # Disable Kafka for local development
