spring:
  datasource:
    url: jdbc:h2:mem:platform;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  docker:
    compose:
      enabled: false
  flyway:
    locations: classpath:db/migration

platform:
  auth:
    jwt:
      issuer: arch-hands-on-platform-test
      audience: platform-api-test
      secret: test-jwt-secret-minimum-32-bytes-long
      access-token-ttl: 15m
      refresh-token-ttl: 30d
      clock-skew: 60s
  feature:
    cache:
      mode: caffeine
    rate-limit:
      mode: fixed-window
    authorization:
      engine: in-code
  event-publishing:
    mode: in-process  # Options: in-process, kafka, outbox
    kafka:
      enabled: false  # Set to true to enable Kafka publishing
