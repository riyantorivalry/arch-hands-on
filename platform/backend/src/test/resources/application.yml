spring:
  datasource:
    url: jdbc:h2:mem:platform;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  docker:
    compose:
      enabled: false
  flyway:
    locations: classpath:db/migration

platform:
  feature:
    cache:
      mode: caffeine
    rate-limit:
      mode: fixed-window
    authorization:
      engine: in-code
  event-publishing:
    mode: in-process  # Options: in-process, kafka, outbox
    kafka:
      enabled: false  # Set to true to enable Kafka publishing
